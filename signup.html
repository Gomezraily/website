<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <link rel="stylesheet" href="../assets/css/styling.css">
  <script src="../assets/js/script.js" defer></script>
</head>
<body class="signup-bg">
  <img src="assets/img/gian.png" alt="Background Image">
  <a href="../index.html" class="back-btn">← Back</a>
  <div class="form-container">
    <h2>Create Your Account</h2>
    <p>Join the Jordan family</p>
    <form id="signupForm">
      <label>First Name</label>
      <input type="text" id="firstName" placeholder="Enter first name">
      
      <label>Last Name</label>
      <input type="text" id="lastName" placeholder="Enter last name">
      
      <label>Username</label>
      <input type="text" id="newUsername" placeholder="Choose a username">
      
      <label>Password</label>
      <input type="password" id="newPassword" placeholder="Create a password">
      
      <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a href="login.html">Login</a></p>
  </div>
</body>
</html>
